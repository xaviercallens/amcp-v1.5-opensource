# AMCP Configuration
# Can be overridden with AMCP_BROKER_TYPE environment variable
quarkus.amcp.broker-type=${AMCP_BROKER_TYPE:memory}
quarkus.amcp.auto-activate=true

# Kafka configuration (if using Kafka broker)
quarkus.amcp.kafka.bootstrap-servers=localhost:9092
quarkus.amcp.kafka.group-id=amcp-hello-group

# NATS configuration (if using NATS broker)
quarkus.amcp.nats.servers=nats://localhost:4222
quarkus.amcp.nats.connection-name=amcp-hello

# HTTP Configuration
quarkus.http.port=8080

# Logging
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."io.amcp".level=DEBUG
quarkus.log.category."io.quarkus.amcp".level=DEBUG

# Development mode
%dev.quarkus.log.console.color=true

# ========================================
# AMCP v1.6 - LLM Integration Configuration
# ========================================

# ========================================
# General LLM Configuration
# ========================================
amcp.llm.provider=${AMCP_LLM_PROVIDER:ollama}
amcp.llm.model=${AMCP_LLM_MODEL:gemma2:2b}
amcp.llm.timeout=120
amcp.llm.cache.enabled=true
amcp.llm.cache.ttl-hours=24
amcp.llm.max-concurrent-requests=10

# ========================================
# OpenAI Configuration
# ========================================
amcp.llm.openai.endpoint=https://api.openai.com/v1
amcp.llm.openai.api-key=${OPENAI_API_KEY:}
amcp.llm.openai.model=gpt-3.5-turbo
amcp.llm.openai.temperature=0.7
amcp.llm.openai.max-tokens=1000

# ========================================
# Azure OpenAI Configuration
# ========================================
amcp.llm.azure-openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
amcp.llm.azure-openai.api-key=${AZURE_OPENAI_API_KEY:}
amcp.llm.azure-openai.deployment-name=${AZURE_OPENAI_DEPLOYMENT:}
amcp.llm.azure-openai.api-version=2024-02-01
amcp.llm.azure-openai.temperature=0.7
amcp.llm.azure-openai.max-tokens=1000

# ========================================
# Ollama Configuration (Local)
# ========================================
amcp.llm.ollama.endpoint=http://localhost:11434
amcp.llm.ollama.model=gemma2:2b

# ========================================
# LightLLM Configuration
# ========================================
amcp.llm.lightllm.endpoint=http://localhost:8080
amcp.llm.lightllm.temperature=0.7
amcp.llm.lightllm.max-new-tokens=1000
amcp.llm.lightllm.top-p=0.9
amcp.llm.lightllm.top-k=50

# ========================================
# Environment-Specific Overrides
# ========================================

# Development: Use Ollama (local, free, offline)
%dev.amcp.llm.provider=ollama
%dev.amcp.llm.ollama.model=gemma2:2b
%dev.amcp.llm.cache.enabled=true

# Test: Use Ollama with aggressive caching
%test.amcp.llm.provider=ollama
%test.amcp.llm.ollama.model=gemma2:2b
%test.amcp.llm.cache.enabled=true
%test.amcp.llm.cache.ttl-hours=1

# Production: Use OpenAI or Azure OpenAI
%prod.amcp.llm.provider=${AMCP_LLM_PROVIDER:openai}
%prod.amcp.llm.cache.enabled=true
%prod.amcp.llm.cache.ttl-hours=24
%prod.amcp.llm.max-concurrent-requests=20

# ========================================
# Quick Start Examples
# ========================================
# 
# To use OpenAI:
#   export OPENAI_API_KEY="sk-..."
#   export AMCP_LLM_PROVIDER="openai"
#
# To use Azure OpenAI:
#   export AZURE_OPENAI_ENDPOINT="https://your-resource.openai.azure.com"
#   export AZURE_OPENAI_API_KEY="..."
#   export AZURE_OPENAI_DEPLOYMENT="gpt-4"
#   export AMCP_LLM_PROVIDER="azure-openai"
#
# To use Ollama (default):
#   ollama pull gemma2:2b
#   export AMCP_LLM_PROVIDER="ollama"
#
# To use LightLLM:
#   python -m lightllm.server.api_server --model_dir /path/to/model --port 8080
#   export AMCP_LLM_PROVIDER="lightllm"
#

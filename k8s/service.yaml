apiVersion: v1
kind: Service
metadata:
  name: amcp
  namespace: amcp
  labels:
    app: amcp
    version: v1.6.0
spec:
  type: LoadBalancer
  selector:
    app: amcp
    framework: quarkus
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 8080
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: amcp-headless
  namespace: amcp
  labels:
    app: amcp
    version: v1.6.0
spec:
  clusterIP: None
  selector:
    app: amcp
    framework: quarkus
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

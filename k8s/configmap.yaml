apiVersion: v1
kind: ConfigMap
metadata:
  name: amcp-config
  namespace: amcp
  labels:
    app: amcp
    version: v1.6.0
data:
  application.properties: |
    # Quarkus Configuration
    quarkus.application.name=AMCP v1.6
    quarkus.application.version=1.6.0
    quarkus.http.port=8080
    quarkus.http.host=0.0.0.0
    
    # Kafka Configuration
    kafka.bootstrap.servers=kafka:9092
    mp.messaging.incoming.events.connector=smallrye-kafka
    mp.messaging.incoming.events.topic=amcp-events
    mp.messaging.incoming.events.group.id=amcp-consumer-group
    mp.messaging.outgoing.events.connector=smallrye-kafka
    mp.messaging.outgoing.events.topic=amcp-events
    
    # AMCP Configuration
    amcp.broker.type=kafka
    amcp.mesh.enabled=true
    amcp.security.enabled=true
    
    # Logging
    quarkus.log.level=INFO
    quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
    
    # Health Checks
    quarkus.health.enabled=true
    quarkus.smallrye-health.root-path=/q/health
    
    # Metrics
    quarkus.micrometer.enabled=true
    quarkus.micrometer.export.prometheus.enabled=true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amcp
  namespace: amcp
  labels:
    app: amcp
    version: v1.6.0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amcp
  namespace: amcp
  labels:
    app: amcp
    version: v1.6.0
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amcp
  namespace: amcp
  labels:
    app: amcp
    version: v1.6.0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amcp
subjects:
- kind: ServiceAccount
  name: amcp
  namespace: amcp
